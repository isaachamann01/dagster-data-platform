[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-platform-monorepo"
version = "0.1.0"
description = "Contract-driven medallion architecture monorepo (tooling root)"
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
    "packages/data-platform-common/src",
    "services/synthetic-api/src",
    "projects/example_pipelines/src",
    "projects/test_project/src",
    "tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RET"]
ignore = [
    "SIM108", # ternary expressions are not always clearer
    "RET504", # unnecessary assignment before return can aid debugging
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = [
    "packages/data-platform-common/src",
    "services/synthetic-api/src",
    "projects/example_pipelines/src",
    "projects/test_project/src",
]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true
exclude = "src/.*/defs/"

[[tool.mypy.overrides]]
module = ["pyspark.*", "delta.*", "trino.*", "boto3", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "projects/test_project/tests"]
addopts = "-ra"
markers = [
    "slow: requires a local Spark session (Java) and is skipped by default runs",
    "smoke: end-to-end smoke tests that materialize real Delta pipelines",
    "docker: requires Docker services (MinIO, Trino) and is skipped by default runs",
]
filterwarnings = [
    "ignore::DeprecationWarning:dagster.*",
    "ignore::DeprecationWarning:pyspark.*",
]
