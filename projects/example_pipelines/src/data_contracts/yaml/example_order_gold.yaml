name: example_order_gold
version: "1.0"
table: example_order_gold
layer: gold
description: Curated gold contract for the child order dataset.
columns:
  - name: order_id
    type: string
    primary_key: true
    constraints:
      regex: "^ORD-[0-9]{6}$"
  - name: store_id
    type: string
    nullable: false
  - name: quantity
    type: integer
    nullable: false
    constraints:
      min_value: 1
      max_value: 10
  - name: total_price
    type: double
    nullable: false
    constraints:
      min_value: 0.5
  - name: event_date
    type: date
    nullable: false
expectations:
  - name: population_present
    type: row_count_min
    params:
      min: 1
