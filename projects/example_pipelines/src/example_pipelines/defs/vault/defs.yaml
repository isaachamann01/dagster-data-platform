# Data Vault 2.0 example for the related store/order pair:
#   hubs       retail/hub/hub_store, retail/hub/hub_order
#   link       retail/link/lnk_store_order
#   satellites retail/sat/sat_store_profile, retail/sat/sat_order_details
type: data_platform_datavault.components.data_vault_factory.DataVaultFactory
attributes:
  vault_name: retail
  hash_delimiter: "||"
  layer: vault
  sources:
    - name: example_store
      contract: data_contracts.get_example_store_silver_contract_path
      pipeline_name: example_store
    - name: example_order
      contract: data_contracts.get_example_order_silver_contract_path
      pipeline_name: example_order
  hubs:
    - name: store
      source: example_store
      business_keys: [store_id]
    - name: order
      source: example_order
      business_keys: [order_id]
  links:
    - name: store_order
      relationships:
        - hub: order
          columns: [order_id]
          source: example_order
        - hub: store
          columns: [store_id]
          source: example_store
  satellites:
    - name: store_profile
      source: example_store
      parent: store
      attributes: [store_name, region, event_date]
      load_ts_column: created_at
    - name: order_details
      source: example_order
      parent: order
      attributes: [quantity, unit_price, event_date]
      load_ts_column: created_at
