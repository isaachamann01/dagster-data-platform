# Optional Trino catalog for querying the Delta tables directly from MinIO.
# Trino's Delta Lake connector reads filesystem tables without a metastore when
# `delta.register-table-procedure.enabled` is used with the filesystem-only mode.
connector.name=delta_lake
delta.register-table-procedure.enabled=true
hive.metastore=file
hive.metastore.catalog.dir=/tmp/trino-metastore
delta.file-system-only=true
s3.endpoint=http://minio:9000
s3.path-style-access=true
s3.access-key=minioadmin
s3.secret-key=minioadmin
s3.region=us-east-1
